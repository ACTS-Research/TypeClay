<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Type Toy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:wght@100..1000&family=Fraunces:wght@100..900&family=Bricolage+Grotesque:wght@200..800&family=Big+Shoulders+Display:wght@100..900&family=Unbounded:wght@200..900&family=Archivo:wght@100..900&family=Bodoni+Moda:wght@400..900&family=Instrument+Sans:wght@400..700&family=JetBrains+Mono:wght@400..600&display=swap">
<style>
  /* Layout: app bar on top; stage (the artwork) fills the left, a ruler-edged
     control column on the right. Stacks to one column on phones. */
  :root {
    --paper: #E9ECF1;      /* app ground, cool grey biased to the accent */
    --panel: #F7F8FA;
    --stage: #DCE0E7;
    --ink: #15171C;
    --muted: #5C6372;
    --line: #CDD2DB;
    --accent: #3A2EF5;     /* ultramarine: controls, focus, playhead */
    --on-accent: #FFFFFF;
    --font-ui: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
    --font-display: "Roboto Flex", "Helvetica Neue", Arial, sans-serif;
    --r: 6px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #101217; --panel: #171A20; --stage: #0B0C10; --ink: #E7E9EE;
      --muted: #8D94A3; --line: #2B303A; --accent: #8C84FF; --on-accent: #0B0C10;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #101217; --panel: #171A20; --stage: #0B0C10; --ink: #E7E9EE;
    --muted: #8D94A3; --line: #2B303A; --accent: #8C84FF; --on-accent: #0B0C10;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font: 14px/1.45 var(--font-ui);
    display: grid;
    grid-template-rows: auto minmax(0, 1fr);
  }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---------- app bar ---------- */
  header {
    display: flex; align-items: center; gap: 12px 20px; flex-wrap: wrap;
    padding-block: 10px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    border-bottom: 1px solid var(--line);
    background: var(--panel);
  }
  .mark {
    font: 400 22px/1 var(--font-display);
    letter-spacing: -0.01em;
    display: flex; margin: 0;
  }
  .mark span { animation: breathe 2.4s ease-in-out infinite; animation-delay: calc(var(--i) * -0.18s); }
  @keyframes breathe { 0%, 100% { font-weight: 200; } 50% { font-weight: 900; } }
  #tabs { display: flex; gap: 4px; }
  #tabs a {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 12px 6px 6px; border-radius: 999px;
    color: var(--muted); text-decoration: none; font-weight: 600;
    border: 1px solid transparent;
  }
  #tabs a b {
    display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%;
    font: 600 11px var(--font-mono); background: var(--paper); color: var(--muted);
    border: 1px solid var(--line);
  }
  #tabs a:hover { color: var(--ink); }
  #tabs a[aria-current="page"] { color: var(--ink); border-color: var(--line); background: var(--paper); }
  #tabs a[aria-current="page"] b { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .word-field { margin-left: auto; display: flex; align-items: center; gap: 8px; flex: 1 1 220px; max-width: 360px; }
  .word-field label { font: 600 11px var(--font-mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
  #word {
    flex: 1; min-width: 0;
    font: 600 18px var(--font-ui); color: var(--ink);
    background: var(--paper); border: 1px solid var(--line); border-radius: var(--r);
    padding: 6px 10px;
  }

  /* ---------- workspace ---------- */
  main { display: grid; grid-template-columns: minmax(0, 1fr) 340px; grid-template-rows: minmax(0, 1fr); min-height: 0; }
  .stage-col { display: grid; grid-template-rows: minmax(0, 1fr) auto; min-height: 0; min-width: 0; }
  #stage {
    position: relative; min-height: 0; display: grid; place-items: center;
    background:
      linear-gradient(var(--line) 1px, transparent 1px) 0 0 / 24px 24px,
      linear-gradient(90deg, var(--line) 1px, transparent 1px) 0 0 / 24px 24px,
      var(--stage);
    background-blend-mode: normal;
  }
  #frame { position: relative; box-shadow: 0 1px 0 var(--line), 0 18px 40px -18px rgba(0,0,0,.35); }
  #canvas { display: block; width: 100%; height: 100%; }
  #stage[data-proto="echo"] #canvas { cursor: crosshair; touch-action: none; }
  .transport {
    display: flex; align-items: center; gap: 12px;
    padding-block: 10px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: 16px;
    border-top: 1px solid var(--line); background: var(--panel);
  }
  #play {
    display: inline-flex; align-items: center; gap: 6px;
    font: 600 13px var(--font-ui); color: var(--ink); background: var(--paper);
    border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px 5px 9px; cursor: pointer;
  }
  #play::before { content: ""; width: 0; height: 0; border-left: 9px solid currentColor; border-top: 5.5px solid transparent; border-bottom: 5.5px solid transparent; }
  #play[aria-pressed="true"]::before { width: 9px; height: 11px; border: 0; background: linear-gradient(90deg, currentColor 3px, transparent 3px 6px, currentColor 6px); }
  #scrub { flex: 1; min-width: 60px; }
  #time { font: 12px var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* ---------- control column ---------- */
  aside {
    background: var(--panel); border-left: 1px solid var(--line);
    overflow-y: auto; min-height: 0;
    padding-block: 16px 32px;
    padding-left: 18px;
    padding-right: max(18px, env(safe-area-inset-right, 0px));
    display: flex; flex-direction: column; gap: 22px;
  }
  .proto-intro h2 { margin: 0 0 4px; font: 700 20px/1.1 var(--font-ui); }
  .proto-intro p { margin: 0; color: var(--muted); }
  .group { display: flex; flex-direction: column; gap: 12px; }
  .group h3, .panel-title {
    margin: 0; font: 600 11px var(--font-mono); text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--muted); display: flex; align-items: center; gap: 8px;
  }
  .group h3::after, .panel-title::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .hint { margin: -4px 0 0; color: var(--muted); font-size: 13px; }
  #proto-panel, #text-panel, #export-panel { display: flex; flex-direction: column; gap: 14px; }

  .ctl { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .ctl > label, .ctl-label, .ctl-head label { font-weight: 600; font-size: 13px; }
  .ctl-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .ctl-head label { cursor: default; user-select: none; }
  output { font: 12px var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
  select {
    font: 500 14px var(--font-ui); color: var(--ink); background: var(--paper);
    border: 1px solid var(--line); border-radius: var(--r); padding: 6px 8px; width: 100%;
  }

  input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 20px; background: transparent; margin: 0; }
  input[type="range"]::-webkit-slider-runnable-track { height: 2px; background: var(--line); }
  input[type="range"]::-moz-range-track { height: 2px; background: var(--line); }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 14px; height: 14px; margin-top: -6px; border-radius: 50%;
    background: var(--panel); border: 2px solid var(--accent); cursor: grab;
  }
  input[type="range"]::-moz-range-thumb { width: 10px; height: 10px; border-radius: 50%; background: var(--panel); border: 2px solid var(--accent); cursor: grab; }
  input[type="range"]:active::-webkit-slider-thumb { background: var(--accent); cursor: grabbing; }

  .seg { position: relative; display: flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--paper); }
  .seg input { position: absolute; opacity: 0; pointer-events: none; }
  .seg label {
    flex: 1 1 auto; text-align: center; padding: 6px 8px; cursor: pointer; font-size: 13px; font-weight: 500;
    color: var(--muted); border-right: 1px solid var(--line); white-space: nowrap;
  }
  .seg label:last-of-type { border-right: 0; }
  .seg input:checked + label { background: var(--ink); color: var(--paper); }
  .seg input:focus-visible + label { outline: 2px solid var(--accent); outline-offset: -2px; }

  .toggle { flex-direction: row; align-items: center; gap: 10px; }
  .toggle label { font-weight: 500; }
  .toggle input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }

  .swatches { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
  .swatch {
    aspect-ratio: 1; max-width: 100%; border-radius: var(--r); cursor: pointer; padding: 0;
    background: var(--sw-bg); color: var(--sw-fg); border: 1px solid var(--line);
    font: 800 15px var(--font-display); position: relative;
  }
  .swatch::after { content: ""; position: absolute; right: 4px; bottom: 4px; width: 6px; height: 6px; border-radius: 50%; background: var(--sw-alt); }
  .swatch[aria-checked="true"] { outline: 2px solid var(--accent); outline-offset: 2px; }
  .colors { display: flex; gap: 12px; flex-wrap: wrap; }
  .color { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); cursor: pointer; }
  .color input { width: 28px; height: 28px; padding: 0; border: 1px solid var(--line); border-radius: 50%; background: none; cursor: pointer; }
  .color input::-webkit-color-swatch-wrapper { padding: 0; }
  .color input::-webkit-color-swatch { border: 0; border-radius: 50%; }
  .color input::-moz-color-swatch { border: 0; border-radius: 50%; }

  .ab-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 14px; }
  .ab-head { font: 700 12px var(--font-mono); color: var(--accent); }
  .ab-label { grid-column: 1 / -1; margin: 8px 0 0; font-weight: 600; font-size: 13px; }
  .slider.compact .ctl-head label { font: 600 11px var(--font-mono); color: var(--muted); }
  .curve { width: 100%; height: auto; aspect-ratio: 560 / 220; max-width: 100%; background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); }
  .gesture-status { margin: 0; }

  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn {
    font: 600 13px var(--font-ui); border-radius: var(--r); padding: 8px 12px; cursor: pointer;
    border: 1px solid var(--line); background: var(--paper); color: var(--ink);
  }
  .btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-size: 15px; padding: 11px 14px; }
  .btn.primary:disabled { opacity: 0.5; cursor: progress; }
  .btn.ghost { background: transparent; }
  .estimate { margin: 0; font: 12px var(--font-mono); color: var(--muted); }
  .progress { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; align-items: center; }
  .progress .bar { grid-column: 1 / -1; height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
  .progress .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .1s linear; }
  .progress-label { margin: 0; font: 12px var(--font-mono); color: var(--muted); }

  /* ---------- export result ---------- */
  #result {
    position: fixed; inset: 0; z-index: 20; display: grid; place-items: center;
    background: color-mix(in srgb, var(--stage) 80%, transparent);
    padding-block: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .result-card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 16px; display: flex; flex-direction: column; gap: 12px;
    width: min(560px, 100%); max-height: 100%; overflow: auto;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,.45);
  }
  .result-card img { width: 100%; height: auto; display: block; border: 1px solid var(--line); }
  #result-meta { margin: 0; font: 12px var(--font-mono); color: var(--muted); overflow-wrap: anywhere; }
  #save-note { margin: 0; font-size: 13px; color: var(--muted); }

  @media (max-width: 820px) {
    body { display: block; height: auto; }
    main { grid-template-columns: 1fr; grid-template-rows: auto; }
    .stage-col { grid-template-rows: auto auto; }
    #stage { height: min(78vw, 70vh); }
    aside { border-left: 0; border-top: 1px solid var(--line); overflow: visible; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
    .word-field { margin-left: 0; max-width: none; order: 3; flex-basis: 100%; }
    .transport { padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  }
  @media (prefers-reduced-motion: reduce) { .mark span { animation: none; font-weight: 700; } }
</style>

<header>
  <h1 class="mark" aria-label="Type Toy">
    <span style="--i:0">T</span><span style="--i:1">y</span><span style="--i:2">p</span><span style="--i:3">e</span><span style="--i:4">&nbsp;</span><span style="--i:5">T</span><span style="--i:6">o</span><span style="--i:7">y</span>
  </h1>
  <nav id="tabs" aria-label="Prototypes"></nav>
  <div class="word-field">
    <label for="word">Word</label>
    <input id="word" type="text" maxlength="24" spellcheck="false" autocomplete="off" placeholder="Type a word">
  </div>
</header>

<main>
  <div class="stage-col">
    <div id="stage"><div id="frame"><canvas id="canvas" aria-label="Animated type preview"></canvas></div></div>
    <div class="transport">
      <button id="play" type="button" aria-pressed="true"><span>Pause</span></button>
      <input id="scrub" type="range" min="0" max="0.999" step="0.001" value="0" aria-label="Scrub through the loop">
      <span id="time" aria-live="off"></span>
    </div>
  </div>

  <aside>
    <div class="proto-intro">
      <h2 id="proto-title"></h2>
      <p id="proto-blurb"></p>
    </div>
    <section class="group">
      <h3>Text</h3>
      <div id="text-panel"></div>
    </section>
    <div id="proto-panel"></div>
    <section class="group">
      <h3>Loop &amp; export</h3>
      <div id="export-panel"></div>
    </section>
  </aside>
</main>

<div id="result" hidden>
  <div class="result-card" role="dialog" aria-modal="true" aria-labelledby="result-title">
    <p class="panel-title" id="result-title">Your GIF</p>
    <img id="result-img" alt="">
    <p id="result-meta"></p>
    <div class="btn-row">
      <button id="save" type="button" class="btn primary">Save GIF</button>
      <button id="result-close" type="button" class="btn ghost">Back to editing</button>
    </div>
    <p id="save-note" aria-live="polite"></p>
  </div>
</div>

<script src="js/gif.js"></script>
<script src="js/shell.js"></script>
<script src="js/proto-wave.js"></script>
<script src="js/proto-tween.js"></script>
<script src="js/proto-echo.js"></script>
<script>TypeToy.boot();</script>

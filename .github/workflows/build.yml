name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # tsc --noEmit + vite build (prebuild copies the MediaPipe wasm into public/)
      - run: npm run build
      - name: Install Chromium for the smoke test
        run: npx playwright install --with-deps chromium
      # drives all three prototypes with the mouse fallback; camera is off (?nocam)
      - run: npm run smoke
